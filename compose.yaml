services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no terminal}
      POSTGRES_DB: oportuna_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oportuna-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oportuna_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oportuna-postgres:
